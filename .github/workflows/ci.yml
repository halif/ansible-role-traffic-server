---
name: CI

on:
  push:
    branches:
      - "master"

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint yamllint

      - name: Run yamllint
        run: yamllint -c .config/yamllint.yml .

      - name: Run ansible-lint
        run: ansible-lint

  molecule:
    name: Molecule - Ubuntu 22.04
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Molecule and Docker plugin
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core molecule
          pip install "molecule-plugins[docker]"

      - name: Make role available to Ansible
        run: |
          mkdir -p ~/.ansible/roles
          ln -s "$GITHUB_WORKSPACE" ~/.ansible/roles/traffic_server

      - name: Create Molecule containers
        run: molecule create

      - name: Debug Molecule container permissions
        run: |
          docker ps -a
          docker inspect traffic-server-ubuntu \
            --format 'User={{.Config.User}} ReadonlyRootfs={{.HostConfig.ReadonlyRootfs}} PID={{.State.Pid}} Status={{.State.Status}}'
          docker exec traffic-server-ubuntu /bin/sh -c \
            'id; ls -ld /tmp; touch /tmp/test-write && rm /tmp/test-write; systemctl is-system-running || true'

      - name: Run Molecule tests
        run: molecule test
