---
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: traffic-server-ubuntu
    image: geerlingguy/docker-ubuntu2204-ansible
    pre_build_image: true
    privileged: true
    command: ""

provisioner:
  name: ansible

  config_options:
    defaults:
      interpreter_python: auto_silent
      remote_tmp: /tmp

  inventory:
    host_vars:
      traffic-server-ubuntu:
        ansible_user: root
        ansible_become: false

verifier:
  name: ansible
