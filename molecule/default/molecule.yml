---
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: traffic-server-ubuntu
    image: geerlingguy/docker-ubuntu2204-ansible
    pre_build_image: true
    privileged: true
    command: ""

provisioner:
  name: ansible

  config_options:
    defaults:
      interpreter_python: auto_silent

verifier:
  name: ansible
