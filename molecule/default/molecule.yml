---
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: traffic-server-ubuntu
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host

    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

    tmpfs:
      - /run
      - /run/lock

provisioner:
  name: ansible

  config_options:
    defaults:
      interpreter_python: auto_silent
      remote_tmp: /tmp

  inventory:
    host_vars:
      traffic-server-ubuntu:
        ansible_user: root
        ansible_become: false

verifier:
  name: ansible
