---
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: traffic-server-ubuntu
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    command: /lib/systemd/systemd
    privileged: true
    # Отключаем AppArmor, который душит systemd в GitHub Actions
    security_opts:
      - apparmor:unconfined
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    # Systemd 249+ в Ubuntu 22.04 требует чистый /run для старта
    tmpfs:
      - /run
      - /run/lock

provisioner:
  name: ansible

  config_options:
    defaults:
      interpreter_python: auto_silent
      remote_tmp: /tmp

  inventory:
    host_vars:
      traffic-server-ubuntu:
        ansible_user: root
        ansible_become: false

verifier:
  name: ansible
